<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <rect width="900" height="1100" fill="#fffdf6"/>
  <rect x="24" y="24" width="852" height="1052" fill="none" stroke="#0f766e" stroke-width="3"/>

  <!-- Letterhead -->
