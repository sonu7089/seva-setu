  <text x="450" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#334155">Dr. Arvind Kulkarni, MD (Internal Medicine)</text>
  <text x="450" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#64748b">Reg. No. MMC-45821  |  OPD: Mon-Sat, 9 AM - 1 PM</text>
  <line x1="60" y1="182" x2="840" y2="182" stroke="#0f766e" stroke-width="2"/>

  <!-- Patient line -->
  <g font-family="'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="26" fill="#1e3a8a">
    <text x="64" y="232">Name: Sunita Devi</text>
    <text x="430" y="232">Age/Sex: 46 / F</text>
    <text x="640" y="232">Date: 14/10/2026</text>
  </g>
  <line x1="60" y1="244" x2="840" y2="244" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="64" y="330" font-family="Georgia, serif" font-size="76" font-style="italic" fill="#0f766e">Rx</text>

  <!-- Medicines -->
  <g font-family="'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="30" fill="#1e3a8a">
    <text x="64" y="420">1)  Tab. Paracetamol 650 mg</text>
    <text x="110" y="462" font-size="26">TDS  (after food)   x  3 days</text>

    <text x="64" y="552">2)  Tab. Azithromycin 500 mg</text>
    <text x="110" y="594" font-size="26">OD  (after food)   x  3 days</text>

    <text x="64" y="684">3)  Syp. Dextromethorphan + CPM</text>
    <text x="110" y="726" font-size="26">10 ml  BD  (after food)   x</text>
  </g>

  <!-- Smudge: the number of days for medicine 3 is unreadable / cut off -->
  <ellipse cx="520" cy="716" rx="62" ry="22" fill="#a16207" opacity="0.18"/>
  <ellipse cx="545" cy="722" rx="34" ry="12" fill="#78350f" opacity="0.16"/>

  <g font-family="'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="26" fill="#1e3a8a">
    <text x="64" y="830">Advice: Plenty of warm fluids, rest.</text>
    <text x="64" y="872">Review if fever persists beyond 3 days.</text>
  </g>

  <!-- Signature -->
  <path d="M600 980 C 640 930, 670 1010, 700 960 S 760 940, 790 975" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
  <line x1="580" y1="1000" x2="820" y2="1000" stroke="#94a3b8" stroke-width="1.5"/>
